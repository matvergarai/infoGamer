services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      ORACLE_USERNAME: ${ORACLE_USERNAME:-ADMIN}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      ORACLE_TNS_ALIAS: ${ORACLE_TNS_ALIAS:-infogamer_high}
      ORACLE_TNS_ADMIN: /tmp/wallet
    volumes:
      - ./wallet:/wallet:ro
