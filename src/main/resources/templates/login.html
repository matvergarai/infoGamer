<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Entrar')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="section">
    <div class="wrap narrow">
        <h1>Entrar a Nexus</h1>
        <p class="lead">Con una sesión activa puedes buscar eventos y armar tu perfil.</p>

        <p class="alert error" th:if="${param.error}">Usuario o contraseña incorrectos.</p>
        <p class="alert ok" th:if="${param.logout}">Sesión cerrada.</p>
        <p class="alert ok" th:if="${param.registro}">Cuenta creada. Ya puedes entrar.</p>

        <form class="form-card" th:action="@{/login}" method="post">
            <label for="username">Usuario o correo</label>
            <input id="username" type="text" name="username" autocomplete="username" required>

            <label for="password">Contraseña</label>
            <input id="password" type="password" name="password" autocomplete="current-password" required>

            <button class="btn btn-lime" type="submit">Entrar</button>
        </form>

        <aside class="demo-box">
            <h2>Cuentas de prueba</h2>
            <ul>
                <li><strong>ana</strong> / ana123</li>
                <li><strong>carlos</strong> / carlos123</li>
                <li><strong>admin</strong> / admin123</li>
            </ul>
        </aside>

        <p class="form-note">¿No tienes cuenta? <a th:href="@{/registro}">Regístrate</a></p>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
