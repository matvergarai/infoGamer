<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registro')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="section">
    <div class="wrap narrow">
        <h1>Crear cuenta</h1>
        <p class="lead">Nombre, correo y contraseña. El perfil de jugador se completa después de entrar.</p>

        <form class="form-card" th:action="@{/registro}" th:object="${registroForm}" method="post">
            <label for="nombre">Nombre</label>
            <input id="nombre" type="text" th:field="*{nombre}" autocomplete="name" required>
            <p class="field-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Error</p>

            <label for="email">Correo electrónico</label>
            <input id="email" type="email" th:field="*{email}" autocomplete="email" required>
            <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</p>

            <label for="password">Contraseña</label>
            <input id="password" type="password" th:field="*{password}" autocomplete="new-password" required>
            <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Error</p>

            <button class="btn btn-lime" type="submit">Registrarme</button>
        </form>
        <p class="form-note">¿Ya tienes cuenta? <a th:href="@{/login}">Entra aquí</a></p>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
