<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${evento.titulo})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="section">
    <div class="wrap detail">
        <p class="kicker" th:text="${evento.categoria}">eSports</p>
        <h1>
            <span th:text="${evento.emoji}">🎯</span>
            <span th:text="${evento.titulo}">Evento</span>
        </h1>
        <p class="meta meta-large">
            <span th:text="${evento.videojuego}">Valorant</span>
            ·
            <span th:text="${#temporals.format(evento.fecha, 'dd/MM/yyyy')}">01/01/2026</span>
            ·
            <span th:text="${#temporals.format(evento.hora, 'HH:mm')}">18:00</span>
            ·
            <span th:text="${evento.modalidad}">Presencial</span>
        </p>
        <img class="photo photo-lg" th:src="@{${evento.foto}}" th:alt="${'Fotografía de ' + evento.titulo}">
        <p class="lead" th:text="${evento.descripcion}">Descripción</p>

        <div class="detail-grid">
            <section>
                <h2>Dónde</h2>
                <p th:if="${evento.direccion != null}" th:text="${evento.direccion}">Dirección</p>
                <p>
                    <span th:text="${evento.ciudad}">Ciudad</span>,
                    <span th:text="${evento.pais}">Chile</span>
                </p>
                <p th:if="${evento.enlace != null}">
                    Enlace de acceso:
                    <a th:href="${evento.enlace}" th:text="${evento.enlace}">https://nexus.cl</a>
                </p>
            </section>
            <section>
                <h2>Organizadores</h2>
                <ul>
                    <li th:each="organizador : ${evento.organizadores}" th:text="${organizador}">Org</li>
                </ul>
            </section>
            <section>
                <h2>Requisitos de participación</h2>
                <p th:text="${evento.requisitos}">Requisitos</p>
            </section>
            <section>
                <h2>Inscripción</h2>
                <p th:text="${evento.inscripcion}">Inscripción</p>
            </section>
        </div>
        <p><a class="text-link" th:href="@{/eventos}">Volver a la búsqueda</a></p>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
