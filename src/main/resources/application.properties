spring.application.name=seguridadcalidad
server.port=8080
# La pauta pide que la home cargue en http://[IP]/recetas
server.servlet.context-path=/recetas
spring.thymeleaf.cache=false
spring.web.locale=es_CL
spring.web.locale-resolver=fixed

# Oracle Autonomous Database infogamer (Santiago).
# Servicios en el wallet: infogamer_high, infogamer_medium, infogamer_low, infogamer_tp.
spring.datasource.url=jdbc:oracle:thin:@${ORACLE_TNS_ALIAS:infogamer_high}
spring.datasource.username=${ORACLE_USERNAME:ADMIN}
spring.datasource.password=${ORACLE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

app.jwt.secret=infogamer-recetas-jwt-secreto-duoc
app.jwt.expiracion-ms=3600000
